services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-server
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./scripts:/opt/scripts
      - /home/aform/:/opt/workspace
    ports:
      - 8443:8443
    networks:
      - common-network
    restart: unless-stopped
    shm_size: "1gb"
    labels:
      homelab.image.auto.update: true
    
networks:
  common-network:
    external: true